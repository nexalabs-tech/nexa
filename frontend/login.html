<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexa Admin Login</title>

<style>
body{
    background:#050816;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.login-box{
    background:#111827;
    padding:30px;
    border-radius:15px;
    width:320px;
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#4da3ff;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
</style>

</head>
<body>

<div class="login-box">

<h2>Nexa Admin Login</h2>

<input id="username" placeholder="Username">

<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

</div>

<script>
function login(){

    const user=document.getElementById("username").value;
    const pass=document.getElementById("password").value;

    if(user==="admin" && pass==="nexa123"){
        window.location="admin.html";
    }else{
        alert("Invalid username or password.");
    }

}
</script>

</body>
</html>
