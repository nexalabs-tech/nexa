<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexa Admin Dashboard</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#050816;
    color:white;
}

header{
    background:#0b1220;
    padding:20px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    color:#4da3ff;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    padding:30px;
}

.card{
    background:#111827;
    border-radius:15px;
    padding:25px;
    text-align:center;
    box-shadow:0 0 15px rgba(77,163,255,.2);
}

.card h2{
    color:#4da3ff;
    font-size:32px;
}

.card p{
    color:#ddd;
}
</style>

</head>
<body>

<header>
🚀 Nexa Admin Dashboard
</header>

<div class="dashboard">

<div class="card">
<h2>0</h2>
<p>Quote Requests</p>
</div>

<div class="card">
<h2>0</h2>
<p>Clients</p>
</div>

<div class="card">
<h2>0</h2>
<p>Projects</p>
</div>

<div class="card">
<h2>Online</h2>
<p>API Status</p>
</div>

</div>

</body>
</html>
