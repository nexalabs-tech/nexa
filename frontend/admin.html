<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexa Admin Dashboard</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#050816;
    color:white;
}

header{
    background:#0b1220;
    padding:20px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    color:#4da3ff;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    padding:30px;
}

.card{
    background:#111827;
    border-radius:15px;
    padding:25px;
    text-align:center;
    box-shadow:0 0 15px rgba(77,163,255,.2);
}

.card h2{
    color:#4da3ff;
    font-size:32px;
}

.card p{
    color:#ddd;
}
</style>

</head>
<body>

<header>
🚀 Nexa Admin Dashboard
</header>

<div class="dashboard">

<div class="card">
<h2 id="quotes">0</h2>
<p>Quote Requests</p>
</div>

<div class="card">
<h2 id="clients">0</h2>
<p>Clients</p>
</div>

<div class="card">
<h2 id="projects">0</h2>
<p>Projects</p>
</div>

<div class="card">
<h2 id="api">Loading...</h2>
<p>API Status</p>
</div>

</div>
<h2 style="text-align:center;margin-top:40px;">Quote Requests</h2>

<div id="quote-list"></div>
<script>

// Dashboard data
fetch("/api/dashboard")
.then(res=>res.json())
.then(data=>{
    document.getElementById("quotes").textContent=data.quoteRequests;
    document.getElementById("clients").textContent=data.clients;
    document.getElementById("projects").textContent=data.projects;
    document.getElementById("api").textContent=data.api;
});

// Quote requests
fetch("/api/quotes")
.then(res=>res.json())
.then(quotes=>{

    const list=document.getElementById("quote-list");

    if(quotes.length===0){
        list.innerHTML="<p style='text-align:center;'>No quote requests yet.</p>";
        return;
    }

    quotes.forEach(q=>{

        list.innerHTML+=`
        <div class="card">
            <h3>${q.name}</h3>
            <p><strong>Email:</strong> ${q.email}</p>
            <p><strong>Phone:</strong> ${q.phone}</p>
            <p><strong>Service:</strong> ${q.service}</p>
            <p><strong>Budget:</strong> ${q.budget}</p>
            <p>${q.description}</p>
        </div>
        `;

    });

});

</script>
</body>
</html>
